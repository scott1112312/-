<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>迷宫探险</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <header>
            <h1>迷宫探险</h1>
            <p>使用方向键（或点击屏幕上的箭头）引导冒险者从左上角走到右下角出口。</p>
        </header>
        <main>
            <section class="board">
                <canvas id="maze" width="600" height="600" aria-label="迷宫画布"></canvas>
                <div class="status" id="status">按下开始生成新的迷宫吧！</div>
            </section>
            <section class="controls">
                <button id="newMaze">生成新迷宫</button>
                <button id="reset">重置当前位置</button>
            </section>
            <section class="touch-controls" aria-label="触控方向键">
                <div class="row">
                    <button class="dir" data-move="up">⬆️</button>
                </div>
                <div class="row">
                    <button class="dir" data-move="left">⬅️</button>
                    <button class="dir" data-move="down">⬇️</button>
                    <button class="dir" data-move="right">➡️</button>
                </div>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
